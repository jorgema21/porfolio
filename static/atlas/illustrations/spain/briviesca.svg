<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none" stroke="#000"
    stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <defs>
        <pattern id="tiles" width="5" height="5" patternUnits="userSpaceOnUse"
            patternTransform="rotate(28)">
            <path d="M0 0V5" stroke-width=".65" opacity=".4" />
        </pattern>
        <g id="window">
            <rect width="6" height="10" rx=".35" fill="#000" fill-opacity=".64" stroke-width=".9" />
            <path d="M3 1V9M-1 11H7" stroke-width=".65" />
        </g>
        <g id="arch">
            <path d="M0 17V7A7 7 0 0 1 14 7V17Z" fill="#000" fill-opacity=".62" />
            <path d="M-3 17V7A10 10 0 0 1 17 7V17M7 1V17" stroke-width=".9" />
        </g>
        <g id="bell-tower">
            <!-- Front and right faces share the same three-unit depth rise. -->
            <path d="M0 24H25V70H0Z" fill="#000" fill-opacity=".09" />
            <path d="M25 24 33 21V67L25 70Z" fill="#000" fill-opacity=".17" />
            <!-- Projecting cornice, with a dome seated on its upper face. -->
            <path d="M-2 20H27L35 17 7 17Z" fill="#000" fill-opacity=".12" />
            <path d="M-2 20H27V24H-2Z" fill="#000" fill-opacity=".15" />
            <path d="M27 20 35 17V21L27 24Z" fill="#000" fill-opacity=".25" />
            <path d="M1 19C2 12 7 6 16 2C24 3 29 9 32 16L24 19Z" fill="#000" fill-opacity=".22" />
            <path d="M9 19Q9 9 16 2Q23 8 24 19M24 19 32 16" stroke-width=".9" />
            <path d="M16 2V-5M12.5 -2H19.5" stroke-width="1.15" />
            <path d="M0 29H25L33 26M0 50H25L33 47" stroke-width="1.15" />
            <path d="M7 44V35A5.5 5.5 0 0 1 18 35V44Z" fill="#000" fill-opacity=".65"
                stroke-width="1.15" />
            <path d="M11 39Q12.5 34 14 39V41L16 42H9L11 41Z" fill="#000" fill-opacity=".8"
                stroke-width=".65" />
            <path d="M27 33 31 31.5V42L27 43.5Z" fill="#000" fill-opacity=".48" stroke-width=".7" />
            <path d="M2 55H8M16 58H23" stroke-width=".7" opacity=".45" />
        </g>
        <!-- Roof surfaces behind the towers must not show through the transparent ink. -->
        <clipPath id="church-roof-left">
            <path d="M-200 -200V440H440V-200Z M43 8H76V82L68 85H43Z" clip-rule="evenodd" />
        </clipPath>
        <clipPath id="church-roof-right">
            <path d="M-200 -200V440H440V-200Z M93 8H126V82L118 85H93Z" clip-rule="evenodd" />
        </clipPath>
        <g id="sunflower" stroke-width="1.1">
            <path d="M0 7Q2 19-1 33M1 22Q-9 22-11 15Q-2 15 1 22ZM1 26Q9 16 13 20Q10 26 1 26Z"
                fill="#000" fill-opacity=".13" />

            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(0)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(30)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(60)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(90)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(120)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(150)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(180)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(210)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(240)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(270)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(300)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <path d="M-2 -5Q-4 -10 0 -12Q4 -10 2 -5Z" transform="rotate(330)" fill="#000"
                fill-opacity=".18" stroke-width=".65" />
            <circle r="6.1" fill="#000" fill-opacity=".55" />
            <path d="M-3 -2H3M-4 1H4M-2 4H2M-2 -4V4M1 -5V5M4 -3V3" stroke-width=".6" opacity=".6" />
        </g>
        <!-- Opaque foreground silhouettes keep the buildings from showing through the canopy and
        plinth. -->
        <clipPath id="roof-cut" clipPathUnits="userSpaceOnUse">
            <path
                d="M-200 -200V440H440V-200Z M54 106Q46 95 59 85Q70 76 84 82Q95 68 112 75Q128 66 145 75Q163 69 174 83Q190 79 199 91Q209 101 197 110Q207 116 190 124Q173 132 126 133Q80 133 62 124Q49 118 54 106Z"
                clip-rule="evenodd" transform="translate(28 42) scale(.78)" />
        </clipPath>
        <clipPath id="base-cut" clipPathUnits="userSpaceOnUse">
            <path d="M-200 -200V440H440V-200Z M59 163 85 170H164L190 163V190L164 198H85L59 190Z"
                clip-rule="evenodd" transform="translate(28 42) scale(.78)" />
        </clipPath>
        <clipPath id="stairs-cut" clipPathUnits="userSpaceOnUse">
            <path d="M-200 -200V440H440V-200Z M178 166 190 163 214 192 202 196Z" clip-rule="evenodd"
                transform="translate(28 42) scale(.78)" />
        </clipPath>
    </defs>
    <!-- A continuous town square, with a common ground plane. -->
    <g clip-path="url(#roof-cut)">
        <g clip-path="url(#base-cut)">
            <g clip-path="url(#stairs-cut)" opacity=".77">
                <!-- Adjoining house: the front gable and the roof meet at the eaves. -->
                <path d="M8 96 22 84 36 96V146H8Z" fill="#000" fill-opacity=".055" />
                <path d="M5 96 22 80 39 96 36 98 22 85 8 98Z" fill="#000" fill-opacity=".18" />
                <path d="M9 113H35M9 130H35" stroke-width=".7" opacity=".5" />
                <use href="#window" x="12" y="101" />
                <use href="#window" x="26" y="101" />
                <path d="M12 146V132H22V146M27 146V132H34V146" fill="#000" fill-opacity=".25"
                    stroke-width="1" />
                <!-- Church: a single pitched roof, with its ridge parallel to the side eaves. -->
                <g clip-path="url(#church-roof-left)">
                    <g clip-path="url(#church-roof-right)">
                        <path d="M36 85 81 64 126 85Z" fill="#000" fill-opacity=".075" />
                        <path d="M81 64 120 49 165 70 126 85Z" fill="#000" fill-opacity=".18" />
                        <path d="M81 64 120 49 165 70 126 85Z" fill="url(#tiles)" stroke="none" />
                        <path d="M81 64 120 49" stroke-width="1.3" />
                    </g>
                </g>
                <use href="#bell-tower" transform="translate(43 22) scale(1 .9)" />
                <use href="#bell-tower" transform="translate(93 15)" />
                <path d="M36 85H126V147H36Z" fill="#000" fill-opacity=".08" />
                <path d="M126 85 165 70V132L126 147Z" fill="#000" fill-opacity=".16" />
                <path d="M34 85H126L165 70M36 91H126L165 76M36 145H126L165 130" stroke-width="1.5" />
                <path d="M40 92V145M66 92V145M98 92V145M122 92V145" stroke-width="1.25" />
                <path d="M44 120 53 113 62 120ZM102 120 111 113 120 120Z" fill="#000"
                    fill-opacity=".10" stroke-width="1.1" />
                <path d="M47 145V123H59V145ZM105 145V123H117V145Z" fill="#000" fill-opacity=".59"
                    stroke-width="1.2" />
                <use href="#arch" x="75" y="123" />
                <path d="M71 116H93M73 113 82 106 91 113Z" fill="#000" fill-opacity=".1"
                    stroke-width="1" />
                <use href="#window" x="50" y="98" />
                <use href="#window" x="79" y="94" />
                <use href="#window" x="108" y="98" />
                <path d="M136 95 143 92V106L136 109ZM151 89 158 86V100L151 103Z" fill="#000"
                    fill-opacity=".58" stroke-width="1.05" />
                <path d="M131 87V143M146 81V137M162 75V131" stroke-width=".8" opacity=".55" />
                <!-- Connecting house: a roof sloping down to the wall's upper edge. -->
                <path d="M165 97 180 91V139L165 145Z" fill="#000" fill-opacity=".12" />
                <path d="M165 97 172 83 180 80V91Z" fill="#000" fill-opacity=".18" />
                <path d="M165 97 172 83 180 80V91Z" fill="url(#tiles)" stroke="none" />
                <path d="M170 109 176 107V116L170 118Z" fill="#000" fill-opacity=".55"
                    stroke-width=".9" />
                <!-- Civic clock tower. The eaves project evenly; the roof pitches inward. -->
                <path d="M180 59H218V145H180Z" fill="#000" fill-opacity=".075" />
                <path d="M218 59 230 54V140L218 145Z" fill="#000" fill-opacity=".16" />
                <path d="M175 54H223L220 46H193Z" fill="#000" fill-opacity=".18" />
                <path d="M223 54 235 49 220 46Z" fill="#000" fill-opacity=".25" />
                <path d="M175 54H223L220 46H193Z M223 54 235 49 220 46Z" fill="url(#tiles)"
                    stroke="none" />
                <path d="M175 54H223V59H175Z" fill="#000" fill-opacity=".21" />
                <path d="M223 54 235 49V54L223 59Z" fill="#000" fill-opacity=".30" />
                <path d="M180 63H218L230 58" stroke-width="1" />
                <!-- Iron bell cage sits on the roof ridge. -->
                <g transform="translate(4 -8)">
                    <path
                        d="M190 54V36L199 22 208 36V54M193 54V36L199 29 205 36V54M190 36H208M190 50H208M199 22V16M196 18H202"
                        stroke-width="1.15" />
                    <path d="M196 43V39Q199 34 202 39V43L204 45H194Z" fill="#000" fill-opacity=".69"
                        stroke-width=".8" />
                    <path d="M199 45V47" stroke-width=".85" />
                </g>
                <circle cx="199" cy="77" r="7.5" />
                <path d="M199 72V77L203 79M199 70V71M199 83V84M192 77H193M205 77H206"
                    stroke-width=".9" />
                <path d="M184 74H188V83H184ZM210 74H214V83H210Z" fill="#000" fill-opacity=".58"
                    stroke-width=".85" />
                <path d="M193 92Q199 88 205 92V98L199 103 193 98Z M199 92V99M196 95H202" fill="#000"
                    fill-opacity=".16" stroke-width=".85" />
                <use href="#window" x="196" y="109" />
                <path
                    d="M188 114V123H210V114M192 115V123M197 115V123M202 115V123M206 115V123M187 124H211"
                    stroke-width=".85" />
                <path d="M191 145V136A8 8 0 0 1 207 136V145Z" fill="#000" fill-opacity=".64" />
                <path d="M188 145V136A11 11 0 0 1 210 136V145" stroke-width=".9" />
                <path
                    d="M222 73 227 71M221 95 229 92M221 121 228 118M181 67H187M211 67H217M182 88H189M209 105H216"
                    stroke-width=".75" opacity=".5" />
                <path
                    d="M42 95H47M60 95H64M69 102H74M92 101H97M114 95H120M42 112H47M63 111H65M101 108H106M119 111H122M37 137H42M63 135H67M98 137H102M128 112 135 109M149 118 155 116M130 129 139 125M157 110 162 108"
                    stroke-width=".7" opacity=".42" />
                <!-- A single continuous paving edge ties the architecture together. -->
                <path
                    d="M6 148H126L165 133 180 139V145H218L232 139M8 153H126L165 138M8 158H39M16 165H44M206 151 232 144"
                    stroke-width="1" opacity=".48" />
            </g>
        </g>
    </g>
    <!-- The bandstand occupies the foreground of the square. -->
    <!-- Scalloped, petal-shaped canopy and iron rim. -->
    <g transform="translate(28 42) scale(.78)">
        <path
            d="M54 106Q46 95 59 85Q70 76 84 82Q95 68 112 75Q128 66 145 75Q163 69 174 83Q190 79 199 91Q209 101 197 110Q207 116 190 124Q173 132 126 133Q80 133 62 124Q49 118 54 106Z"
            fill="#000" fill-opacity=".13" />
        <path
            d="M54 106Q72 96 90 105Q105 97 126 103Q147 97 164 105Q183 98 197 110M59 85 90 105M84 82 108 101M112 75 126 103M145 75 145 101M174 83 164 105M199 91 180 103"
            stroke-width="1.25" />
        <path
            d="M54 106Q73 122 126 122Q174 122 197 110Q207 116 190 124Q173 132 126 133Q80 133 62 124Q49 118 54 106Z"
            fill="#000" fill-opacity=".18" />
        <path d="M57 115Q76 128 126 128Q176 128 195 119" stroke-width=".9" />
        <!-- Fine wrought iron supports and curved brackets. -->
        <path
            d="M65 124V165M69 126V166M89 131V170M93 132V170M158 132V170M162 131V170M182 126V165M186 124V164"
            stroke-width="1.35" />
        <path d="M69 145Q79 131 89 145M93 151Q126 124 158 151M162 145Q172 131 182 145"
            stroke-width="1.35" />
        <path
            d="M72 141Q76 134 80 139Q83 144 78 145M85 138Q82 133 78 135M99 145Q109 131 118 139Q123 146 115 149M152 145Q142 131 133 139Q128 146 136 149M178 141Q174 134 170 139Q167 144 172 145"
            stroke-width=".85" />
        <path d="M126 132V146M123 146H129L128 152H124Z" fill="#000" fill-opacity=".23"
            stroke-width=".9" />
        <!-- Raised octagonal stone platform -->
        <path d="M59 163 85 170H164L190 163V175L164 182H85L59 175Z" fill="#000" fill-opacity=".10"
            stroke-width="1.35" />
        <path d="M59 175 85 182H164L190 175V190L164 198H85L59 190Z" fill="#000" fill-opacity=".15" />
        <path
            d="M85 182V198M164 182V198M59 183 85 190H164L190 183M68 179V192M108 184V190M140 190V197M178 179V193"
            stroke-width=".9" opacity=".72" />
        <!-- Railings follow the octagonal platform, with a gap for the stairs. -->
        <path
            d="M62 150 85 157H164L178 153M62 163 85 170H164L178 166M62 150V163M85 157V170M164 157V170M178 153V166"
            stroke-width="1.2" />

        <path d="M85 157V170" stroke-width=".8" />
        <path d="M85 157l6 13M91 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M91 157V170" stroke-width=".8" />
        <path d="M91 157l6 13M97 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M97 157V170" stroke-width=".8" />
        <path d="M97 157l6 13M103 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M103 157V170" stroke-width=".8" />
        <path d="M103 157l6 13M109 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M109 157V170" stroke-width=".8" />
        <path d="M109 157l6 13M115 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M115 157V170" stroke-width=".8" />
        <path d="M115 157l6 13M121 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M121 157V170" stroke-width=".8" />
        <path d="M121 157l6 13M127 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M127 157V170" stroke-width=".8" />
        <path d="M127 157l6 13M133 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M133 157V170" stroke-width=".8" />
        <path d="M133 157l6 13M139 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M139 157V170" stroke-width=".8" />
        <path d="M139 157l6 13M145 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M145 157V170" stroke-width=".8" />
        <path d="M145 157l6 13M151 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M151 157V170" stroke-width=".8" />
        <path d="M151 157l6 13M157 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M157 157V170" stroke-width=".8" />
        <path d="M157 157l6 13M163 157l-6 13" stroke-width=".6" opacity=".7" />
        <path d="M163 157V170" stroke-width=".8" />
        <path d="M67 151.5v13" stroke-width=".8" />
        <path d="M73 153.3v13" stroke-width=".8" />
        <path d="M79 155.2v13" stroke-width=".8" />
        <!-- Stair flight in the same perspective as the plinth. -->
        <path d="M178 166 190 163 214 192 202 196Z" fill="#000" fill-opacity=".15"
            stroke-width="1.35" />
        <path
            d="M181 170 193 167M184 174 196 171M187 178 199 175M190 182 202 179M193 186 205 183M196 190 208 187"
            stroke-width=".95" />
        <path d="M178 166V153L202 182V196M190 163V150L214 179V192M190 168V182M202 179V190"
            stroke-width="1.15" />
    </g>
    <!-- Ground hatching follows the square and recedes towards the buildings. -->
    <g stroke-width=".85" opacity=".38">
        <path
            d="M7 171H48M14 179H44M12 190H46M37 199H57M65 204H104M113 204H163M170 202H201M217 182H233M220 190H233M213 200H233M89 209H149" />
        <path d="M12 195 35 180M20 206 47 190M227 200 233 205" />
    </g>
    <!-- A foreground strip of sunflowers, arranged as a single receding field edge. -->
    <path
        d="M7 222Q54 215 90 219T167 220Q199 215 233 222M10 230Q56 226 88 230M97 231H145M156 230Q194 226 231 230"
        stroke-width="1" opacity=".4" />
    <g opacity=".88">
        <use href="#sunflower" transform="translate(15 201) rotate(-10) scale(.77)" />
        <use href="#sunflower" transform="translate(35 192) rotate(6) scale(.92)" />
        <use href="#sunflower" transform="translate(54 207) rotate(-8) scale(.58)" />
        <use href="#sunflower" transform="translate(77 215) rotate(8) scale(.35)" />
        <use href="#sunflower" transform="translate(157 215) rotate(-7) scale(.35)" />
        <use href="#sunflower" transform="translate(181 207) rotate(9) scale(.58)" />
        <use href="#sunflower" transform="translate(212 201) rotate(-7) scale(.77)" />
        <use href="#sunflower" transform="translate(228 204) rotate(9) scale(.67)" />
    </g>
</svg>