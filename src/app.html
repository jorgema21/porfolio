<!doctype html>
<html lang="es">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#ffffff" />
	<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

	<title>Portfolio</title>

	<!-- Preconexión rápida a los servidores de Google Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://gstatic.com" crossorigin />

	<!-- LA CLAVE: Prepara la descarga asíncrona pero muta a hoja de estilos de forma nativa -->
	<link 
		rel="preload" 
		href="https://googleapis.com" 
		as="style" 
		onload="this.onload=null;this.rel='stylesheet'"
	/>
	
	<!-- Respaldo físico inmediato por si falla el JS o estamos en entornos locales de red (dev) -->
	<noscript>
		<link 
			rel="stylesheet" 
			href="https://googleapis.com" 
		/>
	</noscript>

	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div id="app">%sveltekit.body%</div>
</body>

</html>
